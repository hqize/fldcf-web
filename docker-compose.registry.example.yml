# 方式 B：服务器只 docker pull 预构建镜像（不在服务器上 docker build）
#
# 使用步骤概要：
# 1. 在 Windows 本机构建并 push 镜像（须加 --platform linux/amd64 以匹配常见云服务器）
# 2. 复制本文件为 docker-compose.registry.yml，按需修改下面两个 image（示例为 Docker Hub dreamom/*）
# 3. 服务器：仍需仓库里的 docker.env；fldcf_data 可随仓库或继续挂载；在仓库根执行：
#    docker compose -f docker-compose.registry.yml --env-file docker.env up -d
#
# 与 docker-compose.yml 的差异：backend / web 无 build，仅 image；mysql 与卷相同。

services:
  mysql:
    image: mysql:8.0
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-fldcf_root_change_me}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-fldcf}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-fldcf_root_change_me}"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    image: dreamom/fldcf-backend:1.0.0
    ports:
      - "${BACKEND_BIND:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"
    environment:
      ENV: ${ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      AUTH_INIT_PASSWORD: ${AUTH_INIT_PASSWORD}
      AUTH_INIT_USERNAME: ${AUTH_INIT_USERNAME:-admin}
      DB_URL: mysql://root:${MYSQL_ROOT_PASSWORD:-fldcf_root_change_me}@mysql:3306/${MYSQL_DATABASE:-fldcf}
      FLDCF_ROOT: /app/FLDCF_raw
      FLDCF_CPU: ${FLDCF_CPU:-1}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost,http://127.0.0.1,http://localhost:80}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
    volumes:
      - ./backend/fldcf_data:/app/backend/fldcf_data
    depends_on:
      mysql:
        condition: service_healthy

  web:
    image: dreamom/fldcf-frontend:1.0.0
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - backend

volumes:
  mysql_data:
