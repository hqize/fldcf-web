appId: com.fldcf.gp-front
productName: GPFront
directories:
  output: release
  buildResources: build
# 白名单模式：只打包 electron 下的 .cjs、图标与 package.json。
# 前端由服务器托管，应用本体只是加载服务器 URL 的壳，不含 dist / node_modules。
files:
  - electron/**/*.cjs
  - build/icon.ico
  - '!node_modules/**'
asar: true
compression: normal
win:
  # 图标自动从 buildResources（build/）查找 build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: GPFront
portable:
  artifactName: ${productName}-${version}-portable.exe
electronLanguages:
  - zh-CN
  - en-US
