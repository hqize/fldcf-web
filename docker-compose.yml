# fldcf：MySQL + 后端 + Nginx 前端
# 用法（在仓库根目录执行，与 backend、gp-front、FLDCF_raw 同级）：
#   1. 准备权重：将 .pt 与 model/ 先放到 backend/fldcf_data/（与本地开发一致）
#   2. 复制环境：copy docker.env.example docker.env，填写 JWT_SECRET_KEY、AUTH_INIT_PASSWORD 等
#   3. docker compose --env-file docker.env up --build
# 1. 首次启动 / 改了代码需要重新构建
# docker compose --env-file docker.env up --build -d

# 2. 后续普通启动（用已有镜像，不重新构建）
# docker compose --env-file docker.env up -d

# # 3. 只是改了 docker.env 配置，重启生效
# docker compose --env-file docker.env down
# docker compose --env-file docker.env up -d

# # 或者更简单，直接重启
# docker compose restart

#
# 浏览器访问 http://<主机IP> 或 http://localhost（前端，80 端口）
# 后端默认只绑定 127.0.0.1:8000（仅服务器本机可访问，局域网用户打不开 :8000）
#
# GPU（可选）：主机安装 NVIDIA 驱动 + Container Toolkit 后，在 docker.env 设
#   PYTORCH_VARIANT=cu118 或 cu124，且 FLDCF_CPU=0，再执行：
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml --env-file docker.env up --build


services:
  mysql:
    image: mysql:8.0
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-fldcf_root_change_me}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-fldcf}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-fldcf_root_change_me}"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        PYTORCH_VARIANT: ${PYTORCH_VARIANT:-cpu}
        APT_MIRROR: ${APT_MIRROR:-official}
        PIP_MIRROR: ${PIP_MIRROR:-official}
    ports:
      # BACKEND_BIND=0.0.0.0 才允许局域网访问 :8000（不推荐对用户开放）
      - "${BACKEND_BIND:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"
    environment:
      ENV: ${ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      AUTH_INIT_PASSWORD: ${AUTH_INIT_PASSWORD}
      AUTH_INIT_USERNAME: ${AUTH_INIT_USERNAME:-admin}
      DB_URL: mysql://root:${MYSQL_ROOT_PASSWORD:-fldcf_root_change_me}@mysql:3306/${MYSQL_DATABASE:-fldcf}
      FLDCF_ROOT: /app/FLDCF_raw
      FLDCF_CPU: ${FLDCF_CPU:-1}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost,http://127.0.0.1,http://localhost:80}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
    volumes:
      # 权重较大，挂载宿主目录便于替换；构建镜像内不含 .pt
      - ./backend/fldcf_data:/app/backend/fldcf_data
    depends_on:
      mysql:
        condition: service_healthy

  front:
    build:
      context: .
      dockerfile: gp-front/Dockerfile
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - backend

volumes:
  mysql_data:
