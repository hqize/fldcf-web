# acid：MySQL + 后端 + Nginx 前端
# 用法（在仓库根目录 D:\Dev\acid）：
#   1. 准备权重：将 .pt 与 model/ 先放到 backend/fldcf_data/（与本地开发一致）
#   2. 复制环境：copy docker.env.example docker.env，填写 JWT_SECRET_KEY、AUTH_INIT_PASSWORD 等
#   3. docker compose --env-file docker.env up --build
#
# 浏览器访问 http://localhost （前端） 后端直连 http://localhost:8000/docs
#
# GPU（可选）：主机安装 NVIDIA 驱动 + Container Toolkit 后，在 docker.env 设
#   PYTORCH_VARIANT=cu124 与 FLDCF_CPU=0，再执行：
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml --env-file docker.env up --build

services:
  mysql:
    image: mysql:8.0
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-acid_root_change_me}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-fldcf}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-acid_root_change_me}"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        PYTORCH_VARIANT: ${PYTORCH_VARIANT:-cpu}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      ENV: ${ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      AUTH_INIT_PASSWORD: ${AUTH_INIT_PASSWORD}
      AUTH_INIT_USERNAME: ${AUTH_INIT_USERNAME:-admin}
      DB_URL: mysql://root:${MYSQL_ROOT_PASSWORD:-acid_root_change_me}@mysql:3306/${MYSQL_DATABASE:-fldcf}
      FLDCF_ROOT: /app/FLDCF_raw
      FLDCF_CPU: ${FLDCF_CPU:-1}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost,http://127.0.0.1,http://localhost:80}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-}
    volumes:
      # 权重较大，挂载宿主目录便于替换；构建镜像内不含 .pt
      - ./backend/fldcf_data:/app/backend/fldcf_data
    depends_on:
      mysql:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: gp-front/Dockerfile
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - backend

volumes:
  mysql_data:
